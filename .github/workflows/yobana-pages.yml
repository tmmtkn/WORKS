name: Publish YOBANA
on:
  push:
    branches: [main]
    paths:
      - 'YOBANA/**'
      - '.github/workflows/yobana-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yobana-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare adopted artwork
        run: |
          mkdir -p public/assets/audio/piano public/assets/fonts
          cp YOBANA/film-fireworks.html public/index.html
          cp YOBANA/piano-credits.html public/
          cp YOBANA/assets/audio/piano/* public/assets/audio/piano/
          cp YOBANA/assets/fonts/* public/assets/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
