<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080e"><title>YOBANA — ことばの花火</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080e;color:#d8dfdf;font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho',serif}canvas{position:absolute;inset:0;width:100%;height:100%}header{position:absolute;top:42px;left:48px;pointer-events:none}h1{font-size:21px;font-weight:400;letter-spacing:.25em;margin:0 0 12px}header p{font:9px sans-serif;letter-spacing:.3em;color:#849698}nav{flex-wrap:wrap;justify-content:flex-end;max-width:70%;position:absolute;right:42px;top:40px;display:flex;gap:8px}button{color:#a8bbbc;border:0;background:transparent;font:11px sans-serif;letter-spacing:.12em;padding:10px;cursor:pointer}button:hover,button:focus-visible{color:#fff;outline:1px solid #526267}main{position:absolute;bottom:68px;width:min(500px,calc(100% - 48px));left:50%;transform:translateX(-50%);text-align:center}label{display:block;color:#a6b5b7;letter-spacing:.22em;font-size:13px;margin-bottom:22px}input{display:block;width:100%;border:0;border-bottom:1px solid #3c4c5266;color:#e3eceb;background:transparent;text-align:center;font:20px Georgia,'Yu Mincho',serif;letter-spacing:.24em;padding:13px;outline:none;border-radius:0}input:focus{border-color:#8cb3b38a}input::placeholder{color:#687c82;font-size:15px}small{display:block;margin-top:17px;font:10px sans-serif;letter-spacing:.12em;color:#7b8e96;line-height:1.9}footer{position:absolute;bottom:23px;left:48px;right:48px;display:flex;justify-content:space-between;font:9px sans-serif;letter-spacing:.2em;color:#61717b}#welcome{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity 2s;width:90%}#welcome p{font-size:19px;letter-spacing:.3em;font-weight:400}#welcome span{font-size:11px;letter-spacing:.16em;color:#81969e}.gone{opacity:0}@media(max-width:600px){header{top:25px;left:25px}nav{right:16px;top:20px;gap:4px}main{bottom:70px}footer{left:25px;right:25px}#welcome p{font-size:16px}}
</style>
<canvas id="sky" aria-label="入力した文字が光の花火として夜空に広がります"></canvas>
<header><h1>YOBANA</h1><p>W O R D S  I N T O  L I G H T</p></header><nav aria-label="操作"><button id="demo">ひとひら試す</button><button id="sound" aria-pressed="false">音をひらく ○</button><button id="motion" aria-pressed="true">視点をとめる</button><button id="clear" aria-label="夜空をクリア">消す</button></nav>
<div id="welcome"><p>ことばが、夜にほどける。</p><span>ひと文字ずつ、光と音のかたちに。</span></div>
<main><label for="words">今、浮かんだことばを。</label><input id="words" placeholder="ここに文字を打つ" autocomplete="off" spellcheck="false" maxlength="200"><small>文字を打つと打ち上がります · 日本語は変換を確定すると咲きます<br>マウスを動かす・空をドラッグすると視点が変わります<br>音は「音をひらく」から · ヘッドフォンで、小さな音量を。</small></main><footer><span>WORDS INTO LIGHT</span><span id="status">夜の余白に、ひとひら。</span></footer>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),field=document.querySelector('input');let W,H,dpr,rockets=[],sparks=[],letters=[],queue=[],soundOn=false,audio,master,reverb,composing=false,lastValue='',nextLaunch=0,last=0,elapsed=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#05080e';ctx.fillRect(0,0,W,H)}addEventListener('resize',resize);resize();
function hash(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return h}
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.24;const limiter=audio.createDynamicsCompressor();master.connect(limiter);limiter.connect(audio.destination);reverb=audio.createConvolver();const len=audio.sampleRate*3,buffer=audio.createBuffer(2,len,audio.sampleRate);for(let c=0;c<2;c++){const a=buffer.getChannelData(c);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.4}reverb.buffer=buffer;const wet=audio.createGain();wet.gain.value=.38;reverb.connect(wet);wet.connect(master)}
function tone(h,x,soft=false){if(!soundOn||!audio)return;const now=audio.currentTime,scale=[0,2,4,7,9],n=h%15,f=220*Math.pow(2,(scale[n%5]+12*Math.floor(n/5))/12);const pan=audio.createStereoPanner();pan.pan.value=Math.max(-.8,Math.min(.8,x/W*1.6-.8));pan.connect(master);pan.connect(reverb);[1,2.756,4.04].forEach((ratio,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f*ratio,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime((soft?.07:.17)/(1+i*3),now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+2.4/(1+i*.5));o.connect(g);g.connect(pan);o.start(now);o.stop(now+2.6)});setTimeout(()=>pan.disconnect(),3200)}
function addText(text){const chars=Array.from(text).filter(c=>! /\s/.test(c));queue.push(...chars.slice(0,80));queue=queue.slice(-100);if(chars.length)document.querySelector('#welcome').classList.add('gone')}
// All positions and trails live in world space; the camera projects them anew each frame.
let moving=!reduced, yaw=0,pitch=0,cameraDistance=860,pointerX=0,pointerY=0,dragging=false;
const motionButton=document.querySelector('#motion');
function motionLabel(){motionButton.textContent=moving?'視点をとめる':'視点をうごかす';motionButton.setAttribute('aria-pressed',String(moving))}motionLabel();
motionButton.onclick=()=>{moving=!moving;motionLabel()};
canvas.style.touchAction='none';
canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||dragging){pointerX=(e.clientX/W-.5)*2;pointerY=(e.clientY/H-.5)*2}});
canvas.addEventListener('pointerleave',()=>{if(!dragging){pointerX=0;pointerY=0}});
function project(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y*cp-z*sp,depth=p.y*sp+z*cp+cameraDistance;if(depth<120)return null;const k=Math.min(W/1000,H/780)*850/depth;return{x:W*.5+x*k,y:H*.40+y*k,k,depth}}
function trace(points,hue,alpha,width){if(points.length<2)return;for(let i=1;i<points.length;i++){const a=project(points[i-1]),b=project(points[i]);if(!a||!b)continue;ctx.strokeStyle=`hsla(${hue},48%,77%,${alpha*Math.pow(i/points.length,1.3)})`;ctx.lineWidth=Math.max(.25,width*b.k);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
const stars=Array.from({length:140},(_,i)=>({x:((i*7919)%1000-500)*3.6,y:((i*3571)%1000-500)*2.4,z:((i*2237)%1000-500)*2.2,phase:i}));
function launch(c){const h=hash(c),tx=((h*137)%1000-500)*.86,ty=-170+((h>>>3)%230),tz=((h*73)%1000-500)*.85;rockets.push({c,h,x:tx*.35,y:370,z:tz+160,sx:tx*.35,sz:tz+160,tx,ty,tz,age:0,dur:reduced?.25:1.4+(h%6)*.1,trail:[]});document.querySelector('#status').textContent='ことばのまわりを、漂う。'}
function bloom(r){const hue=[174,194,214,35,285][r.h%5],count=reduced?28:120;for(let i=0;i<count;i++){const u=1-2*(i+.5)/count,a=i*2.399963,v=36+Math.random()*60,rad=Math.sqrt(1-u*u),shape=r.h%4;let vx=Math.cos(a)*rad*v,vy=u*v,vz=Math.sin(a)*rad*v;if(shape===1){vx*=.55;vy*=1.3}if(shape===2){const petal=1+.3*Math.sin(a*5);vx*=petal;vz*=petal}sparks.push({x:r.x,y:r.y,z:r.z,vx,vy,vz,age:0,life:2.7+Math.random()*2.4,hue,seed:Math.random()*10,swirl:shape===3?.65:.08,trail:[]})}letters.push({c:r.c,x:r.x,y:r.y,z:r.z,age:0,hue});const screen=project(r);tone(r.h,screen?screen.x:W*.5);sparks=sparks.slice(-2200)}
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000||.016,.04);last=t;elapsed+=dt;
if(moving){const smooth=1-Math.exp(-dt*2);yaw+=(Math.sin(elapsed*.11)*.36+pointerX*.55-yaw)*smooth;pitch+=(Math.sin(elapsed*.15)*.10+pointerY*.25-pitch)*smooth;cameraDistance+=(850+Math.sin(elapsed*.09)*75-cameraDistance)*smooth}
ctx.globalCompositeOperation='source-over';ctx.fillStyle='#05080e';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
for(const star of stars){const p=project(star);if(!p)continue;const alpha=(.12+.07*Math.sin(elapsed*.3+star.phase))*Math.min(1,p.k);ctx.fillStyle=`rgba(137,174,191,${alpha})`;const size=Math.max(.45,p.k*.9);ctx.fillRect(p.x,p.y,size,size)}
if(queue.length&&elapsed>nextLaunch){launch(queue.shift());nextLaunch=elapsed+.28}
rockets=rockets.filter(r=>{r.age+=dt;const p=Math.min(r.age/r.dur,1),e=1-Math.pow(1-p,2);r.x=r.sx+(r.tx-r.sx)*e+Math.sin(p*7+r.h)*18*Math.sin(p*Math.PI);r.y=370+(r.ty-370)*e;r.z=r.sz+(r.tz-r.sz)*e+Math.sin(p*Math.PI)*60;r.trail.push({x:r.x,y:r.y,z:r.z});if(r.trail.length>42)r.trail.shift();trace(r.trail,175+r.h%50,.46,.8);const q=project(r);if(q){ctx.fillStyle='#d6eeeb';ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.6,1.2*q.k),0,Math.PI*2);ctx.fill()}if(p>=1){bloom(r);return false}return true});
sparks=sparks.filter(s=>{s.age+=dt;if(s.age>s.life)return false;const drag=Math.exp(-dt*.4),vx=s.vx;s.vx=(s.vx-s.vz*s.swirl*dt)*drag;s.vz=(s.vz+vx*s.swirl*dt)*drag;s.vy=s.vy*drag+dt*7;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.trail.push({x:s.x,y:s.y,z:s.z});if(s.trail.length>30)s.trail.shift();const a=Math.pow(1-s.age/s.life,1.6);trace(s.trail,s.hue,a*.57,.65);const p=project(s);if(p){const size=Math.max(.5,p.k*(.7+.3*Math.sin(s.age*17+s.seed)));ctx.fillStyle=`hsla(${s.hue},55%,84%,${a*.75})`;ctx.fillRect(p.x,p.y,size,size)}return true});
letters=letters.filter(l=>{l.age+=dt;if(l.age>3.8)return false;const p=project({x:l.x,y:l.y-l.age*4,z:l.z});if(!p)return true;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.max(12,23*p.k)}px "Yu Mincho",serif`;ctx.fillStyle=`hsla(${l.hue},28%,85%,${Math.sin(Math.min(l.age/.4,1)*Math.PI/2)*Math.pow(1-l.age/3.8,2)*.75})`;ctx.fillText(l.c,p.x,p.y);return true});}
requestAnimationFrame(frame);
field.addEventListener('compositionstart',()=>composing=true);field.addEventListener('compositionend',()=>{composing=false;consume()});field.addEventListener('input',()=>{if(!composing)consume()});
function consume(){const current=field.value;let i=0;while(i<current.length&&i<lastValue.length&&current[i]===lastValue[i])i++;let end=current.length,oldEnd=lastValue.length;while(end>i&&oldEnd>i&&current[end-1]===lastValue[oldEnd-1]){end--;oldEnd--}addText(current.slice(i,end));lastValue=current}
field.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!composing){field.value='';lastValue=''}});
document.querySelector('#sound').onclick=async()=>{try{initAudio();await audio.resume();soundOn=!soundOn;master.gain.setTargetAtTime(soundOn?.24:0,audio.currentTime,.1);document.querySelector('#sound').textContent=soundOn?'音をとじる ◉':'音をひらく ○';document.querySelector('#sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(hash('余'),W*.5,true)}catch{document.querySelector('#sound').textContent='音を利用できません'}};
document.querySelector('#demo').onclick=()=>addText('余白に咲く');document.querySelector('#clear').onclick=()=>{rockets=[];sparks=[];letters=[];queue=[];field.value='';lastValue='';ctx.clearRect(0,0,W,H);document.querySelector('#welcome').classList.remove('gone');document.querySelector('#status').textContent='夜の余白に、ひとひら。'};
addText('余花');
</script></html>
